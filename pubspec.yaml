name: radio
description: Radio - an interactive radio-frequency experience
version: 0.1.0

environment:
  sdk: ^3.10.0

dependencies:
  jaspr: ^0.23.2
  # Used directly for the Web Audio graph, pointer events and
  # localStorage. It arrives transitively through jaspr, but five files
  # import it by name, so it is declared here rather than left to chance
  # on the next dependency bump.
  universal_web: ^1.1.1

dev_dependencies:
  build_runner: ^2.15.1
  build_web_compilers: ^4.8.0
  lints: ^6.1.0
  jaspr_builder: ^0.23.2
  image: ^4.9.1

jaspr:
  mode: static
