name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Build Jaspr
        run: |
          # Kept in step with the jaspr version in pubspec.lock. 0.23.2's
          # build daemon does not start on Windows, so this is also the
          # first version the site can be built locally with.
          dart pub global activate jaspr_cli 0.23.3
          jaspr build --verbose

      - name: Copy CNAME to build output
        run: cp CNAME build/jaspr/CNAME

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'build/jaspr'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
